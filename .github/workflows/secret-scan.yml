name: secret-scan

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -z | xargs -0 grep -IlE '(^|[^A-Za-z])(sk-[A-Za-z0-9._-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY-----)' -- 2>/dev/null; then
            echo 'Credential-like material found in tracked files.' >&2
            exit 1
          fi
