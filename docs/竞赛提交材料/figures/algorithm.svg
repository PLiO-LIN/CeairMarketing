<polyline points="1200,635 1200,715 800,715 800,790" fill="none" stroke="#245B9E" stroke-width="3" stroke-dasharray="8 6"/>
<polygon points="800,790 793.9104825224427,777.3937405670625 806.0895174775573,777.3937405670625" fill="#245B9E"/>
<rect x="180" y="790" width="1240" height="210" rx="10" fill="#E8F3EF" stroke="#377C62" stroke-width="2"/>
<text x="206" y="822.0" fill="#377C62" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start" dominant-baseline="middle">
<tspan x="206" dy="0">本体与显式规则门禁</tspan>
</text>
<rect x="205" y="855" width="1190" height="110" rx="10" fill="#FFFFFF" stroke="#377C62" stroke-width="2"/>
<text x="800.0" y="887.0" fill="#377C62" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="middle">
<tspan x="800.0" dy="0">模型评分作为观测或建议，不能覆盖业务资格</tspan>
</text>
<text x="800.0" y="926.5" fill="#24364B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="middle">
<tspan x="800.0" dy="0">授权 / 产品适用 / 生效时间 / 库存来源 / 审批</tspan>
</text>
<polyline points="800,1000 800,1080" fill="none" stroke="#245B9E" stroke-width="3"/>
<polygon points="800,1080 793.9104825224427,1067.3937405670624 806.0895174775573,1067.3937405670624" fill="#245B9E"/>
<rect x="40" y="1080" width="1520" height="140" rx="10" fill="#FFFFFF" stroke="#245B9E" stroke-width="2"/>
<text x="800.0" y="1112.0" fill="#245B9E" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">
<tspan x="800.0" dy="0">受控策略与前瞻验证</tspan>
</text>
<text x="800.0" y="1171.0" fill="#24364B" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="middle" dominant-baseline="middle">
<tspan x="800.0" dy="0">影子评分 → 灰度 → 随机对照 → 监控与回滚</tspan>
</text>
<text x="800" y="1280.0" fill="#6B7C90" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="middle">
<tspan x="800" dy="0">虚线部分为建设方案；当前尚未训练或上线预测模型</tspan>
</text>
</svg>