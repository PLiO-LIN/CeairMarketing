<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1330" viewBox="0 0 1600 1330">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="38.0" fill="#6B7C90" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" text-anchor="start" dominant-baseline="middle">
<tspan x="40" dy="0">系统技术方案</tspan>
</text>
<text x="40" y="90.0" fill="#24364B" font-family="Microsoft YaHei, sans-serif" font-size="43" font-weight="700" text-anchor="start" dominant-baseline="middle">
<tspan x="40" dy="0">算法模型与本体约束的扩展架构</tspan>
</text>
<polyline points="40,125 1560,125" fill="none" stroke="#C9D6E6" stroke-width="2"/>
<rect x="40" y="170" width="1520" height="200" rx="10" fill="#F4F6F9" stroke="#6B7C90" stroke-width="2" stroke-dasharray="8 6"/>
<text x="66" y="202.0" fill="#6B7C90" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start" dominant-baseline="middle">
<tspan x="66" dy="0">训练数据与离线评估</tspan>
</text>
