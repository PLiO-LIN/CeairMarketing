<polyline points="1170,370 1170,470" fill="none" stroke="#245B9E" stroke-width="3" stroke-dasharray="8 6"/>
<polygon points="1170,470 1163.9104825224429,457.39374056706254 1176.0895174775571,457.39374056706254" fill="#245B9E"/>
