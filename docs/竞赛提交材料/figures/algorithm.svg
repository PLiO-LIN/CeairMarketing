</text>
<text x="1200.0" y="560.25" fill="#24364B" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="middle" dominant-baseline="middle">
<tspan x="1200.0" dy="0">策略价值 / 合资格排序</tspan>
<tspan x="1200.0" dy="34">实验口径 / 成本约束</tspan>
</text>
