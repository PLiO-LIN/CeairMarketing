<tspan x="800.0" dy="0">历史时点特征 · 成熟标签 · 时间切分 · 随机实验</tspan>
</text>
<text x="800.0" y="300.0" fill="#24364B" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="middle">
<tspan x="800.0" dy="0">核查未来泄漏、曝光偏差、分组稳定性及校准</tspan>
</text>
<rect x="40" y="470" width="720" height="165" rx="10" fill="#FFFFFF" stroke="#245B9E" stroke-width="2" stroke-dasharray="8 6"/>
<text x="400.0" y="502.0" fill="#245B9E" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">
<tspan x="400.0" dy="0">倾向与需求预测</tspan>
</text>
<text x="400.0" y="560.25" fill="#24364B" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="middle" dominant-baseline="middle">
<tspan x="400.0" dy="0">购买概率 / 需求区间</tspan>
<tspan x="400.0" dy="34">特征时点 / 模型版本</tspan>
</text>
<rect x="840" y="470" width="720" height="165" rx="10" fill="#FFFFFF" stroke="#245B9E" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1200.0" y="502.0" fill="#245B9E" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">
