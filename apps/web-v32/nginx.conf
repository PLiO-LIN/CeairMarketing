limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  charset utf-8;
  index index.html;
  auth_basic "Ceair Marketing";
  auth_basic_user_file /etc/nginx/.htpasswd;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /health {
    auth_basic off;
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Support direct access when the reverse proxy keeps the /ceair-marketing prefix.
  location ^~ /ceair-marketing/api/ {
    rewrite ^/ceair-marketing(/api/.*)$ $1 last;
  }

  location ^~ /ceair-marketing/ {
    rewrite ^/ceair-marketing(/.*)$ $1 last;
  }

  location /api/ {
    # HTTP 只允许一个 Authorization 头：控制台静态层用 Basic，业务接口用 Bearer。
    # 这里关掉 Basic，否则前端的每一次 API 调用都会被 401 挡在网关上。
    # 接口自身仍由 Bearer + 租户上下文 + 角色校验保护。
    auth_basic off;
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    client_max_body_size 10m;
  }

  location /docs { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }

  location /assets/ {
    auth_basic off;
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    # Let the platform sign-in page load before application-level authentication.
    auth_basic off;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
