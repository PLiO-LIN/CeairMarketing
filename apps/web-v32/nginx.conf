limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Support direct access when the reverse proxy keeps the /ceair-marketing prefix.
  location ^~ /ceair-marketing/api/ {
    rewrite ^/ceair-marketing(/api/.*)$ $1 last;
  }

  location ^~ /ceair-marketing/ {
    rewrite ^/ceair-marketing(/.*)$ $1 last;
  }

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    client_max_body_size 10m;
  }

  location /docs { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
